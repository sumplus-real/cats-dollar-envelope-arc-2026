<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dollar receipt | CATS</title><link rel="stylesheet" href="style.css"><body><main><header><div class="brand">CATS / DOLLAR RECEIPT</div><a href="index.html">Budget</a></header><h1>One principal.<br>Every signer’s actual fees.</h1><p class="intro">The receipt separates acceptance rights from paid-out funds, and checks each signer’s balance change against value transfers plus network fees. A missing receipt or sender leaves the bill unverified.</p><div id="status"></div><pre id="receipt"></pre></main><script type="module">import {JsonRpcProvider} from './vendor/ethers-6.17.0.min.mjs';import {verifyReceipt} from './verify-receipt.mjs';const $=id=>document.getElementById(id);try{const load=p=>fetch(p).then(r=>{if(!r.ok)throw Error(p+' unavailable');return r.json()});const [r,m,cfg]=await Promise.all(['receipt.json','envelope.json','deployment.json'].map(load));const check=await verifyReceipt(new JsonRpcProvider(cfg.rpc,undefined,{cacheTimeout:0}),r,m,cfg);$('status').textContent=check.mode+' · ALL '+check.receiptCount+' RECEIPTS AND THREE SIGNER BALANCE DELTAS VERIFIED AGAINST RPC';$('status').className='good';$('receipt').textContent=JSON.stringify({check,receipt:r},null,2);}catch(e){$('status').className='bad';$('status').textContent='NOT VERIFIED: '+e.message;}</script></body></html>
